name: Deploy to EC2

on:
  push:
    branches: ['dev']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd ~/SmartRecruitment

            git fetch --all

            git reset --hard origin/dev

            npm install

            npm run build

            pm2 restart smart-recruit
